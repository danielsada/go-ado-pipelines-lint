trigger: none
stages:
- stage: A
  jobs:
  - job: A1
    steps:
    - bash: echo "##vso[task.setvariable variable=flag;isOutput=true]true"
      name: s
  - job: A2
    condition: eq(dependencies.A1.outputs['s.flag'], 'true')  # want: ADO605
    steps:
    - script: echo
  - job: A3
    dependsOn: A1
    condition: eq(dependencies.A1.outputs['s.flag'], 'true')
    variables:
      f: $[ dependencies.A2.outputs['s.flag'] ]  # want: ADO605
    steps:
    - script: echo
- stage: B
  condition: eq(dependencies.A.outputs['A1.s.flag'], 'true')
  jobs:
  - job: B1
    condition: eq(stageDependencies.A.A1.outputs['s.flag'], 'true')
    steps:
    - script: echo
- stage: C
  dependsOn: A
  condition: eq(dependencies.B.result, 'Succeeded')  # want: ADO605
  jobs: []