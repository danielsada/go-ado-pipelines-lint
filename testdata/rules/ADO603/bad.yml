  jobs:
  - job: J
    condition: and(succeeded(), eq(variables.x, 'y'))
    steps:
    - script: echo
      condition: in(variables['Agent.JobStatus'], 'Succeeded')
    - script: echo
      condition: ne(variables.skip, 'true')  # want: ADO603
