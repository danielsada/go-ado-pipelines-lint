version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test -race -count=1 ./...

builds:
  - main: ./cmd/adolint
    binary: adolint
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "adolint_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: danielsada
    name: go-ado-pipelines-lint
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
