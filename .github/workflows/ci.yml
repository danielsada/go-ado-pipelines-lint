name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install script linters
        shell: bash
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          pwsh -NoProfile -Command 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }'
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
        env:
          ADOLINT_INTEGRATION: "1"
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o adolint ./cmd/adolint

  template:
    name: Azure Pipelines template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install script linters
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          pwsh -NoProfile -Command 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }'
      - name: Lint templates/ with adolint (all script rules, linters required)
        run: |
          printf 'scripts:\n  shellcheck: {profile: all}\n  psscriptanalyzer: {profile: all}\n' > "$RUNNER_TEMP/strict.yaml"
          go run ./cmd/adolint lint templates/ --config "$RUNNER_TEMP/strict.yaml" --require-script-linters --fail-on info
      - name: Run the template's install step
        run: |
          go run ./cmd/adolint extract templates/adolint.yml --out "$RUNNER_TEMP/scripts"
          install="$(ls "$RUNNER_TEMP"/scripts/*.sh | head -n1)"
          AGENT_TOOLSDIRECTORY="$RUNNER_TEMP/tools" ADOLINT_VERSION=latest bash "$install"
          AGENT_TOOLSDIRECTORY="$RUNNER_TEMP/tools" ADOLINT_VERSION=0.1.1 bash "$install"
          "$RUNNER_TEMP/tools/adolint/0.1.1/adolint" --version
          ls "$RUNNER_TEMP/tools/adolint"
